# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true

    http_client:
        scoped_clients:
            # Each attempt is cut after max_duration; FormApi retries (ADR 0011).
            form_api.client:
                base_uri: '%env(FORM_API_BASE_URI)%'
                max_duration: 10
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        http_client:
            mock_response_factory: App\Tests\Import\FakeFormApi
        session:
            storage_factory_id: session.storage.factory.mock_file
